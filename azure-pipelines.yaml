trigger:
- uat

resources:
- repo: self

variables:
  project: websites
  region: australiaeast
  app_name: 'connectified-au'
  environment: 'uat'
  azureSubscription: 'scarm-$(app_name)-$(environment)'
  dockerRegistryServiceConnection: 'scacr-$(project)-$(environment)'
  imageRepository: '$(app_name)'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  #tags
  imageTag: '$(Build.BuildNumber)'
  vmImageName: 'ubuntu-latest'
  resourceGroup: 'rg-ca-$(app_name)-$(environment)-$(region)'
  containerAppName: '$(app_name)-$(environment)'
  containerRegistry: "acr$(project)$(environment).azurecr.io"

stages:
- stage: Build
  displayName: Build and push docker images to $(containerRegistry)
  jobs:
  - job: DockerBuildImage
    displayName: Build and push docker images
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        Dockerfile: $(dockerfilePath)
        tags: '$(imageTag)'

- stage: DeployContainerApp
  dependsOn: [Build]
  condition: and(succeeded(), eq($(Build.SourceBranch), uat))
  displayName: Deploy container app
  jobs:
  - job: Deploy
    displayName: Deploy using image tag
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureContainerApps@1
      inputs:
        azureSubscription: $(azureSubscription)
        imageToDeploy : $(containerRegistry)/$(imageRepository):$(imageTag)
        containerAppName: '$(containerAppName)'
        resourceGroup: $(resourceGroup)