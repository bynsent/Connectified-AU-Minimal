# nginx config TEMPLATE for the official nginx image.
# Copied to /etc/nginx/templates/default.conf.template; on container start the
# image runs envsubst and writes /etc/nginx/conf.d/default.conf.
# Only variables that exist in the container env are substituted, so nginx's own
# variables ($uri, $host, ...) are left untouched.
#
# Runtime env (Azure Container App secret, never baked into the image):
#   VITE_MONDAY_API_TOKEN - Monday.com API token, injected into /api/monday requests.
#                           nginx fails to start if it is not set.

# ─── Rate limiting for the Monday proxy ──────────────────────────────────────
# Behind Azure Container Apps ingress $remote_addr is the ingress, so key on the
# forwarded client address when present (best effort; header is client-influenced).
map $http_x_forwarded_for $monday_client_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $monday_client_key zone=monday_api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Hide nginx version from Server header (pentest item: TLS/server fingerprinting)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Monday.com GraphQL reverse proxy ────────────────────────────────────
    # The browser POSTs { query, variables } here; nginx attaches the token and
    # API version so the token never reaches the client bundle.
    location = /api/monday {
        limit_req zone=monday_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # Do not forward client headers/cookies upstream; set only what Monday needs.
        proxy_pass_request_headers off;
        proxy_set_header Host           api.monday.com;
        proxy_set_header Content-Type   "application/json";
        proxy_set_header Content-Length $content_length;
        proxy_set_header Authorization  "${VITE_MONDAY_API_TOKEN}";
        proxy_set_header API-Version    "2024-01";

        proxy_http_version 1.1;
        proxy_pass https://api.monday.com/v2;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Strip upstream headers we don't want to expose
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        add_header Cache-Control "no-store" always;
    }

    # Any other /api/* path is not proxied (no open relay).
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }

    # ─── SPA ─────────────────────────────────────────────────────────────────
    # Prevent caching of HTML responses (pentest item 7: cacheable HTTPS response)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri /index.html;
    }
}

